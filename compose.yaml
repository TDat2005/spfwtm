services:
  mysql:
    image: mysql:8.4
    container_name: competitive-merchant-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: competitive_merchant
      MYSQL_USER: app
      MYSQL_PASSWORD: app_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_dev_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: